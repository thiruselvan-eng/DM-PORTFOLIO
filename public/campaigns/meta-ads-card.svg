<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A3E635"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="798" height="478" rx="15" stroke="#1E293B" stroke-width="2"/>

  <!-- Top App Bar Mockup -->
  <rect x="0" y="0" width="800" height="54" rx="16" fill="#111827"/>
  <circle cx="28" cy="27" r="6" fill="#EF4444" opacity="0.8"/>
  <circle cx="48" cy="27" r="6" fill="#F59E0B" opacity="0.8"/>
  <circle cx="68" cy="27" r="6" fill="#10B981" opacity="0.8"/>
  
  <!-- Breadcrumb / Header Text -->
  <text x="100" y="32" fill="#94A3B8" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="500">Meta Ads Manager › Campaigns › Practice Campaign (Video Views)</text>
  <rect x="670" y="14" width="105" height="26" rx="13" fill="#1E293B"/>
  <text x="722" y="31" fill="#A3E635" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">COMPLETED</text>

  <!-- Filter Bar -->
  <rect x="24" y="70" width="752" height="42" rx="8" fill="#131C31" stroke="#1E293B"/>
  <text x="44" y="96" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="600">Active Test Run</text>
  <rect x="145" y="79" width="48" height="24" rx="12" fill="#10B981" fill-opacity="0.2"/>
  <circle cx="178" cy="91" r="7" fill="#10B981"/>
  <text x="210" y="96" fill="#64748B" font-family="sans-serif" font-size="12">Lifetime Total</text>
  <text x="700" y="96" fill="#A3E635" font-family="sans-serif" font-size="12" font-weight="500">Currency: INR (₹)</text>

  <!-- Metric Quick Summary Cards -->
  <!-- Card 1: Budget Spend -->
  <rect x="24" y="128" width="176" height="100" rx="10" fill="#131C35" stroke="#1E293B"/>
  <text x="40" y="156" fill="#94A3B8" font-family="sans-serif" font-size="12">Amount Spent</text>
  <text x="40" y="196" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">₹99.00</text>
  <text x="40" y="216" fill="#A3E635" font-family="sans-serif" font-size="11">● 100% Budget utilized</text>

  <!-- Card 2: Reach -->
  <rect x="216" y="128" width="176" height="100" rx="10" fill="#131C35" stroke="#1E293B"/>
  <text x="232" y="156" fill="#94A3B8" font-family="sans-serif" font-size="12">Accounts Reached</text>
  <text x="232" y="196" fill="#38BDF8" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">4,928</text>
  <text x="232" y="216" fill="#94A3B8" font-family="sans-serif" font-size="11">Tamil Nadu targeted</text>

  <!-- Card 3: Impressions -->
  <rect x="408" y="128" width="176" height="100" rx="10" fill="#131C35" stroke="#1E293B"/>
  <text x="424" y="156" fill="#94A3B8" font-family="sans-serif" font-size="12">Impressions</text>
  <text x="424" y="196" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">5,135</text>
  <text x="424" y="216" fill="#94A3B8" font-family="sans-serif" font-size="11">Frequency: 1.04</text>

  <!-- Card 4: ThruPlays -->
  <rect x="600" y="128" width="176" height="100" rx="10" fill="#131C35" stroke="#A3E635" stroke-opacity="0.4"/>
  <text x="616" y="156" fill="#A3E635" font-family="sans-serif" font-size="12" font-weight="600">ThruPlays (Result)</text>
  <text x="616" y="196" fill="#A3E635" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">1,354</text>
  <text x="616" y="216" fill="#A3E635" font-family="sans-serif" font-size="11">₹0.07 / ThruPlay</text>

  <!-- Chart / Visual Performance Line -->
  <rect x="24" y="244" width="752" height="212" rx="10" fill="#131C31" stroke="#1E293B"/>
  <text x="44" y="274" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Video View Delivery Breakdown</text>
  <text x="44" y="294" fill="#64748B" font-family="sans-serif" font-size="12">Placements: Instagram Reels (82%) | Instagram Feed (18%)</text>

  <!-- Horizontal bar visual -->
  <rect x="44" y="316" width="712" height="12" rx="6" fill="#1E293B"/>
  <rect x="44" y="316" width="584" height="12" rx="6" fill="#A3E635"/>
  <text x="44" y="348" fill="#94A3B8" font-family="sans-serif" font-size="11">Reels (82%)</text>
  <text x="640" y="348" fill="#94A3B8" font-family="sans-serif" font-size="11">Feed (18%)</text>

  <!-- Mini data row table -->
  <line x1="44" y1="366" x2="756" y2="366" stroke="#1E293B" stroke-width="1"/>
  <text x="44" y="392" fill="#94A3B8" font-family="sans-serif" font-size="12">Objective</text>
  <text x="44" y="412" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="500">Video Views</text>

  <text x="216" y="392" fill="#94A3B8" font-family="sans-serif" font-size="12">Optimization</text>
  <text x="216" y="412" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="500">ThruPlay (15-Sec)</text>

  <text x="408" y="392" fill="#94A3B8" font-family="sans-serif" font-size="12">Location</text>
  <text x="408" y="412" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="500">Tamil Nadu, India</text>

  <text x="600" y="392" fill="#94A3B8" font-family="sans-serif" font-size="12">Campaign Nature</text>
  <text x="600" y="412" fill="#A3E635" font-family="sans-serif" font-size="13" font-weight="600">Practice Run</text>

  <text x="44" y="442" fill="#64748B" font-family="sans-serif" font-size="11" font-style="italic">Note: Transparently disclosed practice campaign. Reflects actual Meta Ads Manager reported metrics.</text>
</svg>
