<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1035"/>
      <stop offset="50%" stop-color="#15132B"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="limePostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E635"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#purpleGrad)"/>
  <rect x="1" y="1" width="798" height="478" rx="15" stroke="#1E293B" stroke-width="2"/>

  <!-- Left: Promotional Poster 1 (Square 1:1 Social Creative Concept) -->
  <g transform="translate(50, 45)">
    <rect width="250" height="250" rx="14" fill="#0E172A" stroke="#C084FC" stroke-opacity="0.5" stroke-width="2"/>
    
    <!-- Poster Header Badge -->
    <rect x="20" y="20" width="80" height="20" rx="4" fill="#A3E635"/>
    <text x="60" y="34" fill="#0B1020" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">NEW DROP</text>
    
    <!-- Bold Typography Hook -->
    <text x="20" y="80" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="800">SUMMER</text>
    <text x="20" y="105" fill="#A3E635" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="800">SPECIAL.</text>
    <text x="20" y="130" fill="#94A3B8" font-family="sans-serif" font-size="11">Limited Edition Series</text>

    <!-- Visual element: shoe / product silhouette -->
    <circle cx="170" cy="140" r="45" fill="#C084FC" fill-opacity="0.15"/>
    <path d="M140 150 C150 120, 190 120, 205 145 C210 155, 170 170, 140 150 Z" fill="#C084FC"/>
    
    <!-- Call to action button on poster -->
    <rect x="20" y="195" width="105" height="32" rx="6" fill="#FFFFFF"/>
    <text x="72" y="215" fill="#0B1020" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SHOP NOW →</text>
    
    <text x="20" y="280" fill="#94A3B8" font-family="sans-serif" font-size="11">Concept Ad: E-Commerce Promotional Poster</text>
  </g>

  <!-- Middle: Vertical 9:16 Story/Reel Creative Overlay -->
  <g transform="translate(330, 45)">
    <rect width="150" height="250" rx="12" fill="#131C35" stroke="#A3E635" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="15" y="20" width="120" height="18" rx="4" fill="#1E293B"/>
    <text x="75" y="32" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">STORY AD FORMAT</text>
    
    <text x="18" y="75" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold">GROW YOUR</text>
    <text x="18" y="95" fill="#38BDF8" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold">BRAND.</text>
    
    <!-- Decorative graphic bars -->
    <rect x="18" y="120" width="114" height="6" rx="3" fill="#A3E635"/>
    <rect x="18" y="132" width="75" height="6" rx="3" fill="#38BDF8"/>
    
    <rect x="25" y="195" width="100" height="28" rx="14" fill="#A3E635"/>
    <text x="75" y="213" fill="#0B1020" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">SWIPE UP ⚡</text>

    <text x="0" y="280" fill="#94A3B8" font-family="sans-serif" font-size="11">9:16 Story Ad Frame</text>
  </g>

  <!-- Right: Principles & Objectives -->
  <g transform="translate(520, 50)">
    <rect width="130" height="26" rx="13" fill="#C084FC" fill-opacity="0.15"/>
    <text x="65" y="18" fill="#C084FC" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">DESIGN PRACTICE</text>

    <text x="0" y="65" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">Ad Creative Design</text>
    <text x="0" y="90" fill="#94A3B8" font-family="sans-serif" font-size="12">Scroll-stopping composition & contrast</text>

    <!-- Checklist items -->
    <g transform="translate(0, 115)">
      <circle cx="10" cy="10" r="8" fill="#A3E635" fill-opacity="0.2"/>
      <path d="M6 10 L9 13 L14 7" stroke="#A3E635" stroke-width="2"/>
      <text x="26" y="14" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="500">Instant 0.5s visual anchor</text>
    </g>

    <g transform="translate(0, 155)">
      <circle cx="10" cy="10" r="8" fill="#A3E635" fill-opacity="0.2"/>
      <path d="M6 10 L9 13 L14 7" stroke="#A3E635" stroke-width="2"/>
      <text x="26" y="14" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="500">Razor-sharp mobile contrast</text>
    </g>

    <g transform="translate(0, 195)">
      <circle cx="10" cy="10" r="8" fill="#A3E635" fill-opacity="0.2"/>
      <path d="M6 10 L9 13 L14 7" stroke="#A3E635" stroke-width="2"/>
      <text x="26" y="14" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="500">Unambiguous single CTA</text>
    </g>

    <g transform="translate(0, 235)">
      <circle cx="10" cy="10" r="8" fill="#A3E635" fill-opacity="0.2"/>
      <path d="M6 10 L9 13 L14 7" stroke="#A3E635" stroke-width="2"/>
      <text x="26" y="14" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="500">Safe margin adherence for UI overlays</text>
    </g>

    <!-- Tools -->
    <rect x="0" y="290" width="240" height="40" rx="8" fill="#0B1020" stroke="#1E293B"/>
    <text x="16" y="315" fill="#94A3B8" font-family="sans-serif" font-size="11">Tools: <tspan fill="#FFFFFF">Picsart</tspan> • <tspan fill="#FFFFFF">Canva</tspan> • <tspan fill="#FFFFFF">Figma</tspan></text>
  </g>
</svg>
