<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="neonLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E635"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring with Lime Accent -->
  <circle cx="100" cy="100" r="96" fill="url(#avatarBg)" stroke="#1E293B" stroke-width="4"/>
  <circle cx="100" cy="100" r="92" stroke="#A3E635" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Stylized Monogram / Silhouette -->
  <circle cx="100" cy="80" r="32" fill="#243350" stroke="#38BDF8" stroke-width="2"/>
  <path d="M48 160 C48 126, 70 120, 100 120 C130 120, 152 126, 152 160 Z" fill="#243350" stroke="#38BDF8" stroke-width="2"/>

  <!-- Monogram T in center -->
  <path d="M86 70 H114 M100 70 V94" stroke="#A3E635" stroke-width="5" stroke-linecap="round"/>

  <!-- Online status badge -->
  <circle cx="152" cy="152" r="12" fill="#0B1020"/>
  <circle cx="152" cy="152" r="8" fill="#A3E635"/>
</svg>
